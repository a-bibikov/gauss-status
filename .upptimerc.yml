# Upptime для status.gausslab.io (ADR-0016). Это копия конфигурации: живая лежит в репозитории albibikov/gauss-status
# (создан из шаблона upptime/upptime), туда её и копировать после правок — README.md рядом.
# Проверки — из GitHub Actions раз в 5 минут, страница — GitHub Pages: статус открывается, даже когда наш сервер лежит.
owner: a-bibikov
repo: gauss-status
user-agent: a-bibikov

# Подстановки $SECRET в проверках не нужны: пустой список выключает их совсем
secrets: []

sites:
  - name: Website
    url: https://gausslab.io
    expectedStatusCodes: [200]
    maxResponseTime: 3000
    slug: website
  # Приём событий: 204 — ingest и его зависимости здоровы (nginx /up → /healthz через auth_request, тело наружу не уходит)
  - name: Event collection
    url: https://collect.gausslab.io/up
    expectedStatusCodes: [204]
    maxResponseTime: 2000
    slug: collect
  - name: Tracker script
    url: https://collect.gausslab.io/js/gauss.js
    expectedStatusCodes: [200]
    maxResponseTime: 2000
    slug: tracker
  - name: API
    url: https://api.gausslab.io/up
    expectedStatusCodes: [204]
    maxResponseTime: 2000
    slug: api
  - name: Dashboard
    url: https://app.gausslab.io
    expectedStatusCodes: [200]
    maxResponseTime: 3000
    slug: dashboard

status-website:
  cname: status.gausslab.io
  name: Gauss Analytics
  introTitle: "**Gauss Analytics status**"
  introMessage: Live status of the website, event collection, tracker script, API and dashboard. Checked every 5 minutes from outside our servers.
  logoUrl: https://gausslab.io/icon.svg
  favicon: https://gausslab.io/icon.svg
  faviconSvg: https://gausslab.io/icon.svg
  theme: dark
  navbar:
    - title: Status
      href: /
    - title: gausslab.io
      href: https://gausslab.io
    - title: Documentation
      href: https://gausslab.io/docs

# Сообщения бота в истории репозитория — без эмодзи-шума
commitMessages:
  commitAuthorName: Gauss Status
  commitAuthorEmail: upptime@users.noreply.github.com

skipDescriptionUpdate: true
skipTopicsUpdate: true
