# Upptime для status.gausslab.io (ADR-0016). Это копия конфигурации: живая лежит в репозитории a-bibikov/gauss-status
# (создан из шаблона upptime/upptime), туда её и копировать после правок — README.md рядом.
# Проверки — из GitHub Actions раз в 5 минут, страница — GitHub Pages: статус открывается, даже когда наш сервер лежит.
owner: a-bibikov
repo: gauss-status
user-agent: a-bibikov

# Секреты, которые Upptime передаёт в проверки: только токен Globalping (необязателен — без него анонимный лимит
# Globalping по IP раннера, который делят и другие пользователи GitHub). Новые секреты (уведомления) — дописать сюда.
secrets:
  - GLOBALPING_TOKEN

# Проверки — из Европы через Globalping (не с раннера GitHub в США): время ответа близко к тому, что видят пользователи.
# location — «волшебная строка» Globalping: случайная точка в Европе, поэтому время немного плавает от проверки к проверке.
sites:
  - name: Website
    url: https://gausslab.io
    expectedStatusCodes: [200]
    maxResponseTime: 3000
    slug: website
    type: globalping
    location: Europe
  # Приём событий: 204 — ingest и его зависимости здоровы (nginx /up → /healthz через auth_request, тело наружу не уходит)
  - name: Event collection
    url: https://collect.gausslab.io/up
    expectedStatusCodes: [204]
    maxResponseTime: 2000
    slug: collect
    type: globalping
    location: Europe
  - name: Tracker script
    url: https://collect.gausslab.io/js/gauss.js
    expectedStatusCodes: [200]
    maxResponseTime: 2000
    slug: tracker
    type: globalping
    location: Europe
  - name: API
    url: https://api.gausslab.io/up
    expectedStatusCodes: [204]
    maxResponseTime: 2000
    slug: api
    type: globalping
    location: Europe
  - name: Dashboard
    url: https://app.gausslab.io
    expectedStatusCodes: [200]
    maxResponseTime: 3000
    slug: dashboard
    type: globalping
    location: Europe

status-website:
  cname: status.gausslab.io
  name: Gauss Analytics
  introTitle: "**Gauss Analytics status**"
  introMessage: Live status of the website, event collection, tracker script, API and dashboard. Checked every 5 minutes from Europe, outside our servers.
  # Оформление в стиле кабинета: папка assets/ (рядом) копируется в корень репозитория gauss-status, Upptime отдаёт её
  # с сайта; шрифты и логотип свои, без сторонних CDN. Тема — через themeUrl (links версия Upptime в шаблоне не выводит);
  # она грузится раньше global.css, поэтому правила темы начинаются с «html » (assets/gauss-theme.css).
  # Адреса темы, логотипа и иконки — только полные: относительные (/gauss-theme.css) сборщик Sapper обходит раньше,
  # чем Upptime копирует assets/, сохраняет на их месте папки 404 и копирование падает с EISDIR.
  themeUrl: https://status.gausslab.io/gauss-theme.css
  logoUrl: https://status.gausslab.io/logo.svg
  favicon: https://status.gausslab.io/icon.svg
  faviconSvg: https://status.gausslab.io/icon.svg
  # Ответы GitHub API (инциденты) браузер кэширует 10 минут вместо 2: анонимный лимит GitHub — 60 запросов в час
  # с IP, загрузка страницы тратит 3–4. Сводка статуса читается не через API и обновляется как прежде.
  productionCacheTime: 600000
  navbar:
    - title: Status
      href: /
    - title: gausslab.io
      href: https://gausslab.io
    - title: Documentation
      href: https://gausslab.io/docs

i18n:
  allSystemsOperational: All systems operational
  overallUptime: "Uptime $UPTIME"
  averageResponseTime: "Response $TIME ms"

# Сообщения бота в истории репозитория — без эмодзи-шума
commitMessages:
  commitAuthorName: Gauss Status
  commitAuthorEmail: upptime@users.noreply.github.com

skipDescriptionUpdate: true
skipTopicsUpdate: true
